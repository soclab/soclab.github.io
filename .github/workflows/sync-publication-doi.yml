name: Check publication DOIs daily

on:
  schedule:
    # GitHub Actions cron uses UTC. 18:15 UTC is 03:15 KST the next day.
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-publication-doi-main
  cancel-in-progress: false

jobs:
  update-dois:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install DOI lookup dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Search DOI metadata for unresolved publications
        run: python add_doi.py publications.json --no-artifacts

      - name: Commit DOI updates
        run: |
          if git diff --quiet -- publications.json; then
            echo "No new DOI metadata found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "Auto-update publication DOI metadata"
          git pull --rebase origin main
          git push origin HEAD:main
