name: Sync achievement news

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-achievement-news-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison commit
        shell: bash
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BEFORE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "BEFORE_SHA=$BEFORE_SHA" >> "$GITHUB_ENV"

      - name: Install DOI lookup dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Add DOI metadata to changed publications
        run: |
          python add_doi.py publications.json \
            --changed-from "$BEFORE_SHA" \
            --no-artifacts

      - name: Generate achievement news
        env:
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          python tools/sync_achievement_news.py \
            --before "$BEFORE_SHA" \
            --commit-date "$COMMIT_DATE"

      - name: Commit generated publication data and news
        run: |
          if git diff --quiet -- publications.json news.json; then
            echo "No publication data or achievement news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json news.json
          git commit -m "Auto-update publication data and news [skip ci]"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
